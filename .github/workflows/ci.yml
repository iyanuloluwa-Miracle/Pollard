name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run check-types

      - run: npm test

      - name: Run vscode-test layers (Linux, headless via xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:vscode

      - name: Run vscode-test layers
        if: runner.os != 'Linux'
        run: npm run test:vscode
